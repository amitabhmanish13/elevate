apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: demo
data:
  POSTGRES_DB: demodb
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: demo123

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: demo
data:
  init.sql: |
    -- Create users table
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        email VARCHAR(100) UNIQUE NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create tasks table
    CREATE TABLE IF NOT EXISTS tasks (
        id SERIAL PRIMARY KEY,
        title VARCHAR(200) NOT NULL,
        description TEXT,
        user_id INTEGER REFERENCES users(id),
        completed BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Insert sample data
    INSERT INTO users (name, email) VALUES 
        ('Alice Johnson', 'alice@demo.com'),
        ('Bob Smith', 'bob@demo.com'),
        ('Carol Davis', 'carol@demo.com')
    ON CONFLICT (email) DO NOTHING;

    INSERT INTO tasks (title, description, user_id, completed) VALUES 
        ('Setup Cilium Demo', 'Configure Cilium with Hubble for network visibility', 1, true),
        ('Deploy Monitoring Stack', 'Install Prometheus and Grafana', 1, true),
        ('Create Network Policies', 'Implement security policies using Cilium', 2, false),
        ('Test Application Flow', 'Verify end-to-end connectivity', 2, false),
        ('Generate Demo Traffic', 'Create sample network traffic for visibility', 3, false)
    ON CONFLICT DO NOTHING;

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: demo
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgres-config
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - demo
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - demo
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-script
        configMap:
          name: postgres-init

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo
  labels:
    app: postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres