apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: database-policy
  namespace: demo
spec:
  endpointSelector:
    matchLabels:
      app: postgres
  ingress:
  # Only allow traffic from backend
  - fromEndpoints:
    - matchLabels:
        app: backend
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  egress:
  # Allow DNS
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP